[package]
name = "netm-guest"
description = "NetM guest side: TUN device, routing/DNS setup and packet pump over the Type-C link"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
netm-proto = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
anyhow = "1.0.104"
ipnet = "2.12.2"
hostname = "0.4.2"
tun-rs = { version = "2.8.10", features = ["async"] }

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[example]]
name = "guest_headless"
