[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/Luckyji6/NetM"
authors = ["Luckyji6 <lucky123456jx@qq.com>"]

[profile.release]
# The packet path crosses all four workspace crates. Cross-crate inlining is
# worth the slightly longer release build for a long-running tunnel binary.
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
# Internal crates
netm-proto = { path = "crates/netm-proto" }
netm-host = { path = "crates/netm-host" }
netm-guest = { path = "crates/netm-guest" }

# Async runtime & I/O
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.12"
futures = "0.3"
thiserror = "2.0"
tracing = "0.1"
unicode-width = "0.2"

# Serialization (control payloads use postcard)
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }

# Networking
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.31", features = ["net", "user"] }
if-addrs = "0.15"
# USB serial fallback transport (netm-proto)
tokio-serial = "5.5.0"
# Windows only: elevation check (netm-proto)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

# Host: user-space TCP/IP stack and packet building/parsing
ipstack = "1.0.1"
etherparse = "0.20"
anyhow = "1.0"
hostname = "0.4"
