name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p package dist
          lipo -create \
            target/aarch64-apple-darwin/release/netm \
            target/x86_64-apple-darwin/release/netm \
            -output package/netm
          chmod +x package/netm
          package/netm --version
          cp README.md LICENSE package/
          version="${GITHUB_REF_NAME#v}"
          tar -C package -czf "dist/netm-${version}-macos-universal.tar.gz" netm README.md LICENSE
      - uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build and package
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          mkdir -p package dist
          cp target/x86_64-unknown-linux-gnu/release/netm package/
          package/netm --version
          cp README.md LICENSE package/
          version="${GITHUB_REF_NAME#v}"
          tar -C package -czf "dist/netm-${version}-linux-x86_64.tar.gz" netm README.md LICENSE
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/netm.exe package/
          & package/netm.exe --version
          Copy-Item README.md, LICENSE package/
          $version = ($env:GITHUB_REF_NAME).TrimStart('v')
          Compress-Archive -Path package/netm.exe, package/README.md, package/LICENSE `
            -DestinationPath "dist/netm-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum netm-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "NetM ${GITHUB_REF_NAME#v}" \
            --generate-notes
